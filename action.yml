name: "ContextDoctor"
description: "Static analysis for RAG systems — lint your context before you ever call an LLM."
branding:
  icon: "search"
  color: "purple"

inputs:
  path:
    description: "File or directory to analyze."
    required: false
    default: "."
  format:
    description: "Output format (terminal, json, markdown, html, sarif, badge)."
    required: false
    default: "sarif"
  output:
    description: "Write the report to this file (recommended for sarif/html/json)."
    required: false
    default: "contextdoctor.sarif"
  fail-on:
    description: "Fail the job on findings at or above this severity (error|warning|info). Empty = never fail."
    required: false
    default: ""
  version:
    description: "ContextDoctor version specifier to install (e.g. '==0.1.0')."
    required: false
    default: ""
  extra-args:
    description: "Additional CLI flags, e.g. '--ignore CTX006 --min-chunk-chars 100'."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install ContextDoctor
      shell: bash
      run: python -m pip install --upgrade "contextdoctor${{ inputs.version }}"

    - name: Run ContextDoctor
      shell: bash
      run: |
        FAIL_ARG=""
        if [ -n "${{ inputs.fail-on }}" ]; then
          FAIL_ARG="--fail-on ${{ inputs.fail-on }}"
        fi
        contextdoctor analyze "${{ inputs.path }}" \
          --format "${{ inputs.format }}" \
          --output "${{ inputs.output }}" \
          $FAIL_ARG ${{ inputs.extra-args }}
