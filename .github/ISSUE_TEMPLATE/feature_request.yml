name: Feature request
description: Suggest a new rule, parser, output format, or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the RAG/context pain point, not just the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like ContextDoctor to do? (e.g. a new rule, a new input format.)
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - New rule
        - New parser / input format
        - New output format
        - CLI / config
        - Plugin API
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / prior art
      description: Could this be a plugin? Do other tools do something similar?
