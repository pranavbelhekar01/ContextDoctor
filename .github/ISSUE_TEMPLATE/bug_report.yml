name: Bug report
description: Report incorrect behavior, a crash, or a wrong finding.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please **do not** include real secrets or PII —
        redact any sensitive values in your examples.
  - type: input
    id: version
    attributes:
      label: ContextDoctor version
      description: Output of `contextdoctor --version`.
      placeholder: "contextdoctor 0.1.1"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version & OS
      placeholder: "Python 3.12 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command and a minimal input (redacted) that triggers it.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The report/error output (use `--no-color`). Redact anything sensitive.
      render: shell
