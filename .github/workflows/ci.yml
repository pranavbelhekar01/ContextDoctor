name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest)
        run: pytest -q

      - name: Smoke test the CLI (fully offline)
        run: |
          contextdoctor --version
          contextdoctor rules
          contextdoctor analyze ./examples/messy_docs --format json > /dev/null
          contextdoctor analyze ./examples/messy_docs --format sarif -o results.sarif
          contextdoctor analyze ./examples/messy_docs --format html -o report.html
          contextdoctor analyze ./examples/risky_docs --format badge > /dev/null
          contextdoctor analyze ./examples/mixed_formats --format json > /dev/null
          contextdoctor analyze ./examples/pragma_demo
          contextdoctor compare ./examples/messy_docs ./examples/clean_docs --no-color
          contextdoctor baseline ./examples/messy_docs -o /tmp/bl.json
          contextdoctor analyze ./examples/messy_docs --baseline /tmp/bl.json
          contextdoctor analyze ./examples/messy_docs --plugin examples/plugin/contextdoctor_placeholder_plugin.py > /dev/null
          contextdoctor analyze ./examples/clean_docs
        shell: bash
